<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Production Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="shell">
    <aside class="rail" id="rail">
      <div class="rail-head">
        <a href="#/" class="wordmark" id="wordmark">Production Desk</a>
        <button class="rail-toggle" id="railToggle" aria-label="Show episodes" aria-expanded="false">Episodes</button>
      </div>
      <div class="rail-body" id="railBody">
        <button class="btn btn-primary btn-block" id="newStoryBtn">New story</button>
        <nav class="rail-nav">
          <a href="#/" data-nav="desk">Desk</a>
          <a href="#/topics" data-nav="topics">Topic ideas</a>
        </nav>
        <div class="rail-section-title">Stories</div>
        <ul class="ep-list" id="epList"></ul>
        <div class="setup-note" id="setupNote" hidden></div>
        <button class="btn btn-quiet" id="signOut" hidden style="margin:8px 0 16px">Sign out</button>
      </div>
      <div class="jobs" id="jobs" aria-live="polite"></div>
    </aside>

    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <dialog id="newDialog" class="dialog">
    <form method="dialog" id="newForm">
      <h2>New story</h2>
      <label class="field">
        <span>What's the story about?</span>
        <input name="topic" id="newTopic" required placeholder="Nokia, Theranos, the 737 MAX…" autocomplete="off">
      </label>
      <label class="field">
        <span>Extra Wikipedia articles to read <em>(optional, one per line)</em></span>
        <textarea name="extra" id="newExtra" rows="3" placeholder="Stephen Elop&#10;Symbian"></textarea>
      </label>
      <p class="hint">Research pulls the Wikipedia articles and builds a fact sheet you'll check before any script gets written.</p>
      <div class="dialog-actions">
        <button type="button" class="btn" value="cancel" id="newCancel">Cancel</button>
        <button type="submit" class="btn btn-primary" value="go">Start research</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/static/app.js" type="module"></script>
</body>
</html>
