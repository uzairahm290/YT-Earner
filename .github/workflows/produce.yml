name: Production worker

# Picks up jobs queued from the dashboard: narration, AI illustrations (on Kaggle), video renders, Shorts,
# YouTube uploads.
# Runs every 10 minutes, and right away when the dashboard has GITHUB_DISPATCH_TOKEN set.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Reading this repo's own artifacts lets the uploader fetch a video rendered in an earlier run.
permissions:
  contents: read
  actions: read

# One worker at a time, so two runs never grab the same episode.
concurrency:
  group: production-worker
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # a 20-minute documentary takes ~15-25 minutes to render
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      WIKI_USER_AGENT: ${{ secrets.WIKI_USER_AGENT }}
      # For AI illustrations on Kaggle's free GPU (optional)
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      # For one-click YouTube uploads (optional). Same values as on Render.
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Without the secret there's nothing to read from. Skip quietly instead of failing
      # every 10 minutes (each failed run would send you an email).
      - name: Check the secret is set
        id: setup
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Add DATABASE_URL under Settings → Secrets and variables → Actions (same value as on Render). Skipping until then."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'yes'
      - uses: actions/setup-python@v5
        if: steps.setup.outputs.ready == 'yes'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.setup.outputs.ready == 'yes'

      # Cheap check first: most runs find nothing and finish in under a minute.
      - name: Anything queued?
        if: steps.setup.outputs.ready == 'yes'
        id: queue
        run: |
          set +e
          python cli.py worker --check
          code=$?
          set -e
          if [ $code -eq 0 ]; then echo "work=yes" >> "$GITHUB_OUTPUT";
          elif [ $code -eq 3 ]; then echo "work=no" >> "$GITHUB_OUTPUT";
          else exit $code; fi

      - name: Install the worker's tools
        if: steps.queue.outputs.work == 'yes'
        run: |
          # CPU-only PyTorch (~200 MB instead of ~2 GB) for the parallax depth model
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-worker.txt "kaggle>=2.0"
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Cache the voice model (~350 MB)
        if: steps.queue.outputs.work == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-model-v1.0

      - name: Cache the caption timing and depth models (~175 MB)
        if: steps.queue.outputs.work == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v2

      - name: Run queued jobs
        if: steps.queue.outputs.work == 'yes'
        run: python cli.py worker

      # Finished videos are too big for the database, so they're kept here. Download them from
      # this run's page (Artifacts section) until the upload stage sends them to YouTube.
      - name: Keep the finished videos
        if: always() && steps.queue.outputs.work == 'yes' && hashFiles('output/*.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: output/
          retention-days: 30
          compression-level: 0   # MP4s don't compress further; skip the wasted minutes
