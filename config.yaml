# ─────────────────────────────────────────────────────────────
#  Channel config. Edit this file, not the code.
# ─────────────────────────────────────────────────────────────

channel:
  name: "Your Channel Name"
  niche: "tech documentaries"
  audience: "US"
  # How the narrator should sound on paper. Fed straight into the script prompt.
  voice_style: >
    Calm, curious, slightly dry American documentary narrator.
    Short sentences when tension rises. Never hypes, never sells.

# LLM used for research + scripts. Any OpenAI-compatible endpoint works.
# Free options (limits change, check the provider's site):
#   gemini -> Google AI Studio free tier
#   groq   -> Groq free tier
#   local  -> an OpenAI-compatible server you run (e.g. on Kaggle)
llm:
  provider: gemini
  providers:
    gemini:
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
      model: "gemini-2.5-flash"      # swap if Google renames/retires it
      api_key_env: GEMINI_API_KEY
      max_input_chars: 120000
    groq:
      base_url: "https://api.groq.com/openai/v1"
      model: "llama-3.3-70b-versatile"
      api_key_env: GROQ_API_KEY
      max_input_chars: 40000         # smaller context, so research gets trimmed
    local:
      base_url: "http://localhost:8000/v1"
      model: "qwen2.5-7b-instruct"
      api_key_env: LOCAL_LLM_KEY
      max_input_chars: 30000
  temperature: 0.7
  timeout_seconds: 180

# Where topic ideas come from. US tech outlets only.
topics:
  rss_feeds:
    - https://www.theverge.com/rss/index.xml
    - https://techcrunch.com/feed/
    - https://feeds.arstechnica.com/arstechnica/index
    - https://www.wired.com/feed/rss
    - https://www.cnbc.com/id/19854910/device/rss/rss.html   # CNBC Technology
  # Wikipedia articles getting a spike in US/English traffic often signal a story people want.
  wikipedia_trending: true
  # Only keep Wikipedia trends whose title/description hits one of these.
  trend_keywords:
    - company
    - technology
    - software
    - computer
    - internet
    - startup
    - semiconductor
    - smartphone
    - artificial intelligence
    - founder
    - businessman
    - entrepreneur
    - aircraft
    - spacecraft
    - cryptocurrency
    - video game
  max_candidates: 25

# Documentary shape
script:
  long_minutes: 14          # target length for long-form videos
  words_per_minute: 140     # documentary pace is slower than normal speech
  min_chapters: 4
  max_chapters: 7
  shorts_per_video: 6       # Shorts the script should flag for the cutter

# Narration. Kokoro-82M (Apache 2.0, fine for monetized videos), runs on CPU.
voice:
  default: am_michael        # warm, measured American male
  # Voices offered in the dashboard. a = American, b = British; m = male, f = female.
  choices:
    am_michael: "Michael (US, warm)"
    am_fenrir: "Fenrir (US, deeper)"
    am_onyx: "Onyx (US, low and calm)"
    am_eric: "Eric (US, brighter)"
    af_heart: "Heart (US, female)"
    af_nicole: "Nicole (US, female, soft)"
    bm_george: "George (UK, classic doc)"
  speed: 0.95                # slightly slower than default reads as "documentary"
  lead_in: 0.6               # seconds of room before the first word
  tail: 1.5                  # seconds after the last word
  mp3_bitrate: 64k           # mono speech; plenty for previews, re-rendered at full quality later
  model_dir: ~/.cache/kokoro
  model_url: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0

# Pictures for every beat. Real sources only, never AI images.
visuals:
  candidates_per_beat: 4       # options shown per beat in the dashboard
  min_photo_width: 1000        # skip anything too small to fill a 1080p frame
  # Commons files are only used under these licenses (credited in the description).
  allowed_licenses: ["public domain", "pd", "cc0", "cc by", "cc-by"]
  # Stock video kicks in when the matching key is set (PEXELS_API_KEY / PIXABAY_API_KEY).
  stock_providers: [pexels, pixabay]

# AI illustrations for abstract beats only, generated on Kaggle's free GPU.
# Never used for people, products, brands, maps or documents (see pipeline/illustrate.py).
illustrate:
  model: stabilityai/stable-diffusion-xl-base-1.0     # CreativeML OpenRAIL++-M, commercial use allowed
  vae: madebyollin/sdxl-vae-fp16-fix
  per_beat: 2                # options generated per beat
  steps: 30
  guidance: 6.0
  width: 1344                # SDXL's native 16:9-ish size; scaled to 1080p at render
  height: 768
  kernel_slug: docu-illustrate
  # One house style, so the AI frames look like a deliberate illustration series, never like photos.
  style: >-
    editorial ink illustration, bold confident linework, limited duotone palette of deep navy
    and warm mustard yellow, subtle paper grain, generous negative space, minimalist composition,
    flat shading, no text
  negative: >-
    photo, photograph, photorealistic, realistic, 3d render, text, letters, words, numbers, logo,
    watermark, signature, brand, face close-up, portrait, celebrity, blurry, lowres

# Final cut.
render:
  width: 1920
  height: 1080
  fps: 30
  crf: 20                    # x264 quality: lower = better and bigger. 18–22 is the sweet spot
  preset: veryfast           # x264 speed. GitHub's free runner needs the speed
  max_bitrate: 8M            # YouTube's recommended 1080p30 upload rate; keeps long videos under ~1 GB
  ken_burns_zoom: 0.08       # how far stills drift over a beat (0.08 = 8%)
  lower_third_seconds: 4.5   # how long a name/date caption stays up
  grain: 5                   # film grain strength, 0 to turn off
  preview_seconds: 60        # small preview stored for the dashboard

# Phrases that scream "AI wrote this". Script lint fails if any show up.
banned_phrases:
  - "in today's fast-paced world"
  - "let's dive in"
  - "dive into"
  - "delve"
  - "buckle up"
  - "in conclusion"
  - "it's important to note"
  - "game-changer"
  - "revolutionize"
  - "unleash"
  - "tapestry"
  - "testament to"
  - "in the ever-evolving"
  - "landscape of"
  - "a rollercoaster"
  - "stay tuned"
  - "smash that like button"
  - "without further ado"
  - "little did they know"
